<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Postcards — Upload privé</title><style>body{font:16px system-ui;background:#f4f8f6;color:#082c40;max-width:650px;margin:auto;padding:24px}input,textarea,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0 16px;font:inherit;border-radius:9px;border:1px solid #adc9c6}button{background:#087d84;color:white;border:0}textarea{min-height:100px}.notice{background:#fff3d8;padding:12px;border-radius:9px}img{max-width:100%}</style><a href="./">← Journey Tracker</a><h1>📸 Mes cartes postales</h1><p class="notice">Espace privé de préparation. Les photos et les textes enregistrés ici ne sont pas publiés.</p><section id="login"><label>Courriel autorisé<input id="email" type="email" autocomplete="email"></label><button id="send">Recevoir un lien de connexion</button></section><section id="editor" hidden><p id="identity"></p><label>Date<input id="date" type="date" value="2026-10-24"></label><label>Titre<input id="title" maxlength="120" placeholder="Bien arrivés en Floride !"></label><label>Message<textarea id="message" maxlength="3000"></textarea></label><label>Photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label>Description photo<input id="alt" maxlength="160"></label><button id="save">Enregistrer le brouillon privé</button><button id="logout">Déconnexion</button><h2>Mes brouillons</h2><div id="drafts"></div></section><p id="status" role="status"></p><script src="messages-config.js"></script><script type="module">
const $=id=>document.getElementById(id),status=t=>$('status').textContent=t,cfg=window.JOURNEY_MESSAGES_CONFIG;
const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.49.8');
const sb=createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,detectSessionInUrl:true}});
async function refresh(){const {data:{user}}=await sb.auth.getUser();const allowed=user?.email?.toLowerCase()==='jfr.northcast@gmail.com';$('login').hidden=!!allowed;$('editor').hidden=!allowed;if(allowed){$('identity').textContent=user.email;await list()}}
async function list(){const {data,error}=await sb.from('journey_postcards').select('id,title,message,travel_date,created_at').order('created_at',{ascending:false}).limit(30);$('drafts').replaceChildren();if(error){status(error.message);return}for(const d of data){const p=document.createElement('p');p.textContent=(d.travel_date||'')+' — '+d.title+' (privé)';$('drafts').append(p)}}
$('send').onclick=async()=>{const email=$('email').value.trim();if(email.toLowerCase()!=='jfr.northcast@gmail.com'){status('Ce compte ne peut pas publier.');return}const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.href.split('#')[0]}});status(error?error.message:'Vérifiez votre courriel et ouvrez le lien sur cet appareil.')};
$('save').onclick=async()=>{const {data:{user}}=await sb.auth.getUser();if(user?.email?.toLowerCase()!=='jfr.northcast@gmail.com'){status('Connexion requise.');return}const f=$('photo').files[0];if(!f||!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5000000){status('Choisissez une photo JPEG, PNG ou WebP de 5 Mo maximum.');return}if(!$('title').value.trim()||!$('message').value.trim()||!$('date').value){status('Remplissez la date, le titre et le message.');return}status('Envoi de la photo…');$('save').disabled=true;try{const ext=f.type==='image/png'?'png':f.type==='image/webp'?'webp':'jpg';const path=user.id+'/'+crypto.randomUUID()+'.'+ext;const up=await sb.storage.from('journey-postcards').upload(path,f,{contentType:f.type,upsert:false});if(up.error)throw up.error;const ins=await sb.from('journey_postcards').insert({author_id:user.id,travel_date:$('date').value,title:$('title').value.trim(),message:$('message').value.trim(),photo_path:path,photo_alt:$('alt').value.trim(),published:false});if(ins.error)throw ins.error;status('Brouillon privé enregistré. Rien n’est publié.');await list()}catch(e){status('Erreur : '+e.message)}finally{$('save').disabled=false}};
$('logout').onclick=async()=>{await sb.auth.signOut();await refresh()};sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));await refresh();
</script></html>
